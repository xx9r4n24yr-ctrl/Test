<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <title>Моя ферма</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button class="avatar" id="profileBtn"><img id="avatarImg" src="assets/avatar.svg" alt="avatar"><b>25</b></button>
      <div class="wallet"><span>🪙</span><strong id="coins">12450</strong><button data-buy="coins">+</button></div>
      <div class="wallet"><span>💎</span><strong id="gems">320</strong><button data-buy="gems">+</button></div>
      <div class="wallet energy"><span>⚡</span><strong id="energy">78/100</strong><small id="energyTimer">02:45</small><button data-buy="energy">+</button></div>
      <button class="menu" id="menuBtn">☰</button>
    </header>

    <main id="screen" class="screen farm-screen"></main>

    <nav class="bottom-nav" id="bottomNav">
      <button data-screen="farm" class="active">🏠<span>Ферма</span></button>
      <button data-screen="animals">🐾<span>Животные</span></button>
      <button data-screen="fields">🌾<span>Поля</span></button>
      <button data-screen="market">🛒<span>Рынок</span></button>
      <button data-screen="orders">🚚<span>Заказы</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="close">×</button><div id="modalBody"></div></div></div>
  <script src="game.js"></script>
</body>
</html>
